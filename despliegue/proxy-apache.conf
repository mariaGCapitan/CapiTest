# VirtualHost para el VPS. Sustituye el subdominio, IP_DE_LA_VM y las rutas del certificado.
# Módulos necesarios: a2enmod ssl proxy proxy_http headers
<VirtualHost *:443>
    ServerName capitest.informatica.iesgrancapitan.org

    SSLEngine on
    SSLCertificateFile /RUTA/fullchain.pem
    SSLCertificateKeyFile /RUTA/privkey.pem

    # La VM usa un certificado propio: el tramo VPS-VM va cifrado aunque cruce internet.
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    ProxyPreserveHost On
    ProxyPass / https://IP_DE_LA_VM:8443/
    ProxyPassReverse / https://IP_DE_LA_VM:8443/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
